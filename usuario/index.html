<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Helpdesk — Usuário</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    color-scheme: light;
    --bg: oklch(0.985 0.005 80);
    --surface: #ffffff;
    --surface-2: oklch(0.97 0.004 80);
    --border: oklch(0.92 0.005 80);
    --border-strong: oklch(0.86 0.006 80);
    --ink: oklch(0.18 0.012 80);
    --ink-2: oklch(0.36 0.01 80);
    --muted: oklch(0.55 0.008 80);
    --muted-2: oklch(0.7 0.006 80);
    --accent: #4f46e5;
    --accent-soft: color-mix(in oklab, var(--accent) 10%, white);
    --accent-tint: color-mix(in oklab, var(--accent) 6%, white);
    --danger: oklch(0.6 0.18 25);
    --success: oklch(0.62 0.13 155);
    --warn: oklch(0.72 0.14 75);
    --radius: 14px;
    --radius-sm: 10px;
    --card-pad: 22px;
    --gap: 14px;
    --shadow-sm: 0 1px 0 rgba(20,18,12,.04), 0 1px 2px rgba(20,18,12,.04);
    --shadow-md: 0 1px 0 rgba(20,18,12,.05), 0 6px 18px -10px rgba(20,18,12,.12);
    --shadow-lg: 0 1px 0 rgba(20,18,12,.05), 0 18px 40px -22px rgba(20,18,12,.22);
  }
  [data-theme="dark"] {
    color-scheme: dark;
    --bg: oklch(0.17 0.008 260);
    --surface: oklch(0.21 0.009 260);
    --surface-2: oklch(0.24 0.01 260);
    --border: oklch(0.30 0.012 260);
    --border-strong: oklch(0.38 0.014 260);
    --ink: oklch(0.96 0.005 80);
    --ink-2: oklch(0.82 0.008 80);
    --muted: oklch(0.65 0.012 260);
    --muted-2: oklch(0.52 0.014 260);
    --accent-soft: color-mix(in oklab, var(--accent) 20%, var(--surface));
    --accent-tint: color-mix(in oklab, var(--accent) 12%, var(--surface));
    --shadow-sm: 0 1px 0 rgba(0,0,0,.3), 0 1px 2px rgba(0,0,0,.3);
    --shadow-md: 0 1px 0 rgba(0,0,0,.3), 0 6px 18px -10px rgba(0,0,0,.6);
    --shadow-lg: 0 1px 0 rgba(0,0,0,.3), 0 18px 40px -22px rgba(0,0,0,.8);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Geist', ui-sans-serif, system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    font-feature-settings: "ss01", "cv11";
    min-height: 100vh;
  }
  .mono { font-family: 'Geist Mono', ui-monospace, SFMono-Regular, monospace; }

  button { font-family: inherit; }

  /* ----- Layout shell ----- */
  .shell { height: 100vh; display: flex; flex-direction: column; }
  .topbar {
    height: 60px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 28px; background: color-mix(in oklab, var(--surface) 70%, transparent);
    backdrop-filter: blur(8px);
    position: sticky; top: 0; z-index: 10;
  }
  .topbar-left {
    display: flex; align-items: center; gap: 14px; min-width: 0;
  }
  /* Botão de menu (só em telas pequenas) */
  .nav-toggle {
    display: none; appearance: none; border: 1px solid var(--border);
    background: var(--surface); width: 36px; height: 36px; border-radius: 10px;
    place-items: center; color: var(--ink-2); cursor: pointer; flex-shrink: 0;
  }
  .nav-toggle:hover { background: var(--surface-2); color: var(--ink); border-color: var(--border-strong); }
  .nav-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .nav-scrim { display: none; }

  /* Theme toggle */
  .theme-toggle {
    appearance: none; border: 1px solid var(--border);
    background: var(--surface);
    width: 34px; height: 34px;
    border-radius: 9px;
    display: grid; place-items: center;
    color: var(--ink-2);
    cursor: pointer;
    transition: all .15s ease;
  }
  .theme-toggle:hover {
    background: var(--surface-2);
    color: var(--ink);
    border-color: var(--border-strong);
  }
  .theme-toggle:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .theme-toggle svg { transition: transform .3s cubic-bezier(.2,1,.4,1); }
  .theme-toggle:hover svg { transform: rotate(15deg); }

  /* Dark-mode tone adjustments for type cards */
  [data-theme="dark"] .type-badge.tone-warn {
    color: oklch(0.82 0.13 75);
    background: color-mix(in oklab, var(--warn) 18%, var(--surface));
    border-color: color-mix(in oklab, var(--warn) 35%, var(--border));
  }
  [data-theme="dark"] .type-badge.tone-info {
    color: oklch(0.85 0.10 265);
    background: color-mix(in oklab, var(--accent) 18%, var(--surface));
    border-color: color-mix(in oklab, var(--accent) 35%, var(--border));
  }
  [data-theme="dark"] .input.has-error-input,
  [data-theme="dark"] .textarea.has-error-input {
    background: color-mix(in oklab, var(--danger) 8%, var(--surface));
  }
  [data-theme="dark"] .success-ring {
    background: color-mix(in oklab, var(--success) 18%, var(--surface));
    border-color: color-mix(in oklab, var(--success) 40%, var(--border));
  }
  [data-theme="dark"] .btn-primary {
    background: var(--ink);
    color: var(--bg);
  }
  [data-theme="dark"] .btn-primary:hover {
    background: oklch(0.88 0.005 80);
  }
  [data-theme="dark"] .helptip-pop {
    background: var(--surface);
    color: var(--ink);
    border: 1px solid var(--border-strong);
  }
  [data-theme="dark"] .helptip-pop::before {
    background: var(--surface);
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
    font-weight: 600; letter-spacing: -.01em; font-size: 15px;
  }
  .brand-mark {
    width: 26px; height: 26px; border-radius: 7px;
    background: var(--ink); color: var(--bg);
    display: grid; place-items: center; font-weight: 600; font-size: 13px;
    font-family: 'Geist Mono', monospace;
  }
  .top-meta {
    display: flex; align-items: center; gap: 14px;
    font-size: 13px; color: var(--muted);
  }
  .top-meta .avatar {
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--surface-2); border: 1px solid var(--border);
    display: grid; place-items: center; font-size: 11px;
    font-weight: 500; color: var(--ink-2);
  }

  /* ----- Persona toggle (topo: Usuário / Atendente) ----- */
  .persona-switch {
    display: flex; gap: 3px; padding: 3px;
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 12px;
  }
  .persona-tab {
    appearance: none; border: 0; background: transparent;
    font: inherit; font-size: 13.5px; color: var(--ink-2);
    padding: 8px 18px; border-radius: 9px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 8px;
    transition: all .15s ease; font-weight: 500;
  }
  .persona-tab:hover { color: var(--ink); }
  .persona-tab.is-on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); }
  .persona-tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ----- Workspace: sidebar + conteúdo ----- */
  .workspace { flex: 1; display: flex; min-height: 0; }
  .sidebar {
    width: 252px; flex-shrink: 0;
    border-right: 1px solid var(--border);
    background: var(--surface);
    display: flex; flex-direction: column;
    padding: 20px 14px 16px;
  }
  .side-top { display: none; }
  .side-label {
    font-family: 'Geist Mono', monospace;
    font-size: 10px; text-transform: uppercase; letter-spacing: .09em;
    color: var(--muted-2); padding: 0 12px; margin: 4px 0 10px;
  }
  .side-nav { display: flex; flex-direction: column; gap: 3px; flex: 1; }
  .side-item {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 12px; border-radius: 10px;
    font-size: 14px; color: var(--ink-2); cursor: pointer;
    border: 0; background: transparent; width: 100%; text-align: left;
    font-family: inherit; transition: background .15s ease, color .15s ease;
    position: relative;
  }
  .side-item:hover { background: var(--surface-2); color: var(--ink); }
  .side-item:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .side-item .si-ico { color: var(--muted); display: grid; place-items: center; transition: color .15s ease; }
  .side-item:hover .si-ico { color: var(--ink-2); }
  .side-item.is-on {
    background: var(--accent-tint); color: color-mix(in oklab, var(--accent) 82%, var(--ink));
    font-weight: 500;
  }
  .side-item.is-on .si-ico { color: var(--accent); }
  .side-item.is-on::before {
    content: ""; position: absolute; left: 0; top: 50%; transform: translateY(-50%);
    width: 3px; height: 18px; border-radius: 0 3px 3px 0; background: var(--accent);
  }
  .side-item .si-label { flex: 1; }
  .si-badge {
    font-family: 'Geist Mono', monospace; font-size: 10px; font-weight: 500;
    padding: 2px 7px; border-radius: 999px; line-height: 1.4;
  }
  .si-badge.count {
    min-width: 18px; text-align: center;
    background: var(--accent); color: white;
  }
  .side-item.is-on .si-badge.count { background: var(--accent); }
  .si-badge.soon {
    color: var(--muted); background: var(--surface-2);
    border: 1px solid var(--border); text-transform: none; letter-spacing: 0;
  }

  .side-profile {
    display: flex; align-items: center; gap: 11px;
    padding: 12px 10px 4px; margin-top: 10px;
    border-top: 1px solid var(--border);
  }
  .side-avatar {
    width: 36px; height: 36px; min-width: 36px; border-radius: 50%;
    background: var(--surface-2); border: 1px solid var(--border);
    display: grid; place-items: center; font-size: 12.5px; font-weight: 500; color: var(--ink-2);
  }
  .side-profile-info { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .side-name {
    font-size: 13.5px; font-weight: 500; color: var(--ink);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .side-role { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .role-badge {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 10.5px; font-weight: 500; letter-spacing: .01em;
    padding: 2px 8px 2px 6px; border-radius: 999px;
    color: color-mix(in oklab, var(--accent) 72%, var(--ink));
    background: color-mix(in oklab, var(--accent) 12%, var(--surface));
    border: 1px solid color-mix(in oklab, var(--accent) 26%, var(--border));
  }
  .role-badge .rb-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }

  /* Sub-alternador dentro de "Abrir chamado" (Em etapas / Formulário único) */
  .open-modeswitch { display: flex; gap: 4px; margin-bottom: 22px; }
  .open-mode {
    appearance: none; border: 1px solid var(--border); background: var(--surface);
    font: inherit; font-size: 13px; color: var(--ink-2);
    padding: 7px 14px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 7px; transition: all .15s ease;
  }
  .open-mode:hover { border-color: var(--border-strong); background: var(--surface-2); }
  .open-mode.is-on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .open-mode:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .content { flex: 1; min-width: 0; overflow-y: auto; }

  .main {
    display: flex; flex-direction: column;
    padding: 32px 28px 48px;
    max-width: 1120px; width: 100%; margin: 0 auto;
  }

  /* ===== Telas pequenas: navegação em gaveta ===== */
  @media (max-width: 900px) {
    .shell { height: 100dvh; }
    .topbar { padding: 0 14px; gap: 10px; height: 56px; }
    .nav-toggle { display: grid; }
    .sidebar {
      position: fixed; top: 0; left: 0; bottom: 0; z-index: 60;
      width: min(78vw, 292px); overflow-y: auto;
      border-right: 1px solid var(--border);
      transform: translateX(-100%); transition: transform .24s cubic-bezier(.2,.8,.3,1);
    }
    .sidebar.is-open { transform: none; box-shadow: var(--shadow-lg); }
    .side-top {
      display: flex; align-items: center; gap: 10px;
      padding: 2px 6px 14px; margin-bottom: 4px;
      border-bottom: 1px solid var(--border);
    }
    .side-top-name { font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
    .nav-close {
      appearance: none; border: 1px solid var(--border); background: var(--surface);
      width: 32px; height: 32px; border-radius: 9px; margin-left: auto;
      display: grid; place-items: center; color: var(--ink-2); cursor: pointer;
    }
    .nav-close:hover { background: var(--surface-2); color: var(--ink); }
    .side-item { padding: 12px; font-size: 15px; }
    .nav-scrim {
      display: block; position: fixed; inset: 0; z-index: 55;
      background: color-mix(in oklab, var(--ink) 45%, transparent);
      opacity: 0; pointer-events: none; transition: opacity .2s ease;
    }
    .nav-scrim.is-on { opacity: 1; pointer-events: auto; }
    .main { padding: 22px 16px 40px; }
    .persona-switch { flex-shrink: 0; }
    .persona-tab { padding: 8px 11px; }
    .persona-tab span { display: none; }
    .top-meta { gap: 8px; }
    .mgr-table-wrap { overflow-x: auto; }
    .mgr-table { min-width: 640px; }
    .list-toolbar .mgr-new-btn { order: -1; }
  }
  @media (max-width: 560px) {
    .brand span { display: none; }
    .main { padding: 18px 14px 36px; }
    h1 { font-size: 24px; }
    .lede { font-size: 14px; }
    .pageheader { margin-bottom: 20px; }
    .open-modeswitch { flex-wrap: wrap; margin-bottom: 16px; }
    .kpi { padding: 16px 18px; min-height: 0; }
    .kpi-value { font-size: 30px; }
    .chart-card { padding: 18px 16px; }
    .chart-head { flex-wrap: wrap; }
    .hbar-row { grid-template-columns: 76px 1fr; gap: 10px; }
    .skel-bar-row { grid-template-columns: 76px 1fr; gap: 10px; }
    .dash-toolbar { gap: 8px; }
    .dexport { margin-left: 0; }
    .line-legend { gap: 12px; flex-wrap: wrap; }
  }

  /* ----- Progress + breadcrumb ----- */
  .stepbar {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 24px; min-height: 22px;
  }
  .dots { display: flex; gap: 6px; align-items: center; }
  .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--border-strong);
    transition: all .3s ease;
  }
  .dot.active { background: var(--ink); width: 22px; border-radius: 3px; }
  .dot.done { background: var(--ink-2); }

  .crumbs {
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  }
  .crumb {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 5px 10px 5px 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    font-size: 12.5px; color: var(--ink-2);
    cursor: pointer;
    transition: all .15s ease;
    animation: slideIn .3s ease backwards;
  }
  .crumb:hover { border-color: var(--border-strong); background: var(--surface-2); }
  .crumb-x {
    width: 14px; height: 14px; border-radius: 50%;
    display: grid; place-items: center;
    color: var(--muted-2); font-size: 11px; line-height: 1;
  }
  .crumb:hover .crumb-x { color: var(--ink-2); }
  .crumb-sep { color: var(--muted-2); font-size: 11px; }

  @keyframes slideIn {
    from { opacity: 0; transform: translateX(-4px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  /* ----- Header block ----- */
  .pageheader { margin-bottom: 28px; }
  .eyebrow {
    font-family: 'Geist Mono', monospace;
    font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--muted); margin-bottom: 10px;
  }
  h1 {
    font-size: 32px; line-height: 1.15;
    font-weight: 500; letter-spacing: -.02em;
    margin: 0 0 6px;
    text-wrap: balance;
  }
  .lede {
    font-size: 15px; color: var(--ink-2);
    margin: 0; max-width: 56ch;
    text-wrap: pretty;
  }

  /* ----- Cards grid ----- */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: var(--gap);
  }
  .grid.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  @media (max-width: 720px) {
    .grid.cols-2, .grid.cols-3 { grid-template-columns: 1fr; }
  }

  .card {
    text-align: left;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: var(--card-pad);
    cursor: pointer;
    transition: border-color .15s ease, transform .15s ease, box-shadow .2s ease, background .15s ease;
    display: flex; flex-direction: column; gap: 10px;
    min-height: 132px;
    position: relative;
    font-family: inherit;
    color: inherit;
    width: 100%;
  }
  .card:hover {
    border-color: var(--ink-2);
    box-shadow: var(--shadow-md);
    transform: translateY(-1px);
  }
  .card:active { transform: translateY(0); }
  .card:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .card-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px;
  }
  .card-icon {
    width: 36px; height: 36px; border-radius: 9px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    display: grid; place-items: center;
    color: var(--ink-2);
    transition: all .2s ease;
  }
  .card:hover .card-icon {
    background: var(--accent-tint);
    border-color: color-mix(in oklab, var(--accent) 20%, var(--border));
    color: var(--accent);
  }
  .card-arrow {
    color: var(--muted-2);
    transition: transform .2s ease, color .2s ease;
  }
  .card:hover .card-arrow {
    color: var(--ink); transform: translateX(2px);
  }
  .card-title {
    font-size: 17px; font-weight: 500; letter-spacing: -.01em;
    margin: 0;
  }
  .card-desc {
    font-size: 13.5px; color: var(--muted);
    margin: 0; line-height: 1.45;
    text-wrap: pretty;
  }
  .card-tags {
    display: flex; gap: 4px; flex-wrap: wrap; margin-top: auto;
  }
  .tag {
    font-family: 'Geist Mono', monospace;
    font-size: 10.5px; padding: 3px 7px;
    border-radius: 5px; background: var(--surface-2);
    color: var(--muted); border: 1px solid var(--border);
  }

  /* Density variants */
  .density-compact .card { padding: 16px; min-height: 100px; }
  .density-compact .card-title { font-size: 15.5px; }
  .density-compact .card-desc { font-size: 12.5px; }
  .density-compact .card-icon { width: 30px; height: 30px; border-radius: 7px; }
  .density-compact .grid { gap: 10px; }

  .density-comfy .card { padding: 28px; min-height: 160px; gap: 14px; }
  .density-comfy .card-title { font-size: 19px; }
  .density-comfy .card-icon { width: 42px; height: 42px; border-radius: 11px; }
  .density-comfy .grid { gap: 18px; }

  .no-icons .card-icon { display: none; }

  /* ----- Back link ----- */
  .back {
    appearance: none; border: 0; background: transparent;
    color: var(--ink-2); font-size: 13.5px;
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 10px 6px 6px; border-radius: 8px;
    cursor: pointer; margin-bottom: 16px;
    margin-left: -8px;
    font-family: inherit;
    transition: background .15s ease, color .15s ease;
  }
  .back:hover { background: var(--surface-2); color: var(--ink); }

  /* ----- Form ----- */
  .form-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 32px;
    box-shadow: var(--shadow-sm);
  }
  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 22px 24px;
  }
  .field { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .field.full { grid-column: 1 / -1; }
  .label {
    font-size: 13px; font-weight: 500; color: var(--ink-2);
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .label .hint { font-weight: 400; color: var(--muted-2); font-size: 12px; }
  .req { color: var(--danger); margin-left: 2px; }

  .input, .textarea, .select {
    width: 100%;
    font-family: inherit;
    font-size: 14px;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    transition: border-color .12s ease, box-shadow .12s ease;
  }
  .input:hover, .textarea:hover, .select:hover { border-color: var(--border-strong); }
  .input:focus, .textarea:focus, .select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in oklab, var(--accent) 14%, transparent);
  }
  .textarea { resize: vertical; min-height: 96px; line-height: 1.5; }
  .input::placeholder, .textarea::placeholder { color: var(--muted-2); }

  /* Radio group (segmented) */
  .segmented {
    display: grid; grid-auto-flow: column; grid-auto-columns: 1fr;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 3px;
    gap: 2px;
  }
  .seg {
    appearance: none; border: 0; background: transparent;
    padding: 8px 10px;
    font: inherit; font-size: 13px; color: var(--ink-2);
    border-radius: 7px;
    cursor: pointer;
    transition: all .15s ease;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  }
  .seg:hover { color: var(--ink); }
  .seg.is-on {
    background: var(--surface);
    color: var(--ink);
    box-shadow: var(--shadow-sm);
    font-weight: 500;
  }
  .seg-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .5; }
  .seg.is-on .seg-dot { opacity: 1; }
  .seg-dot.low { color: var(--success); }
  .seg-dot.mid { color: var(--warn); }
  .seg-dot.high { color: var(--danger); }

  /* Checkbox */
  .check {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--surface);
    cursor: pointer;
    transition: all .12s ease;
  }
  .check:hover { border-color: var(--border-strong); background: var(--surface-2); }
  .check input { display: none; }
  .check-box {
    width: 18px; height: 18px; min-width: 18px;
    border: 1.5px solid var(--border-strong); border-radius: 5px;
    margin-top: 1px;
    display: grid; place-items: center;
    background: var(--surface);
    transition: all .12s ease;
  }
  .check input:checked + .check-box {
    background: var(--accent); border-color: var(--accent);
  }
  .check input:checked + .check-box svg { opacity: 1; transform: scale(1); }
  .check-box svg { opacity: 0; transform: scale(.6); transition: all .15s ease; }
  .check-text {
    font-size: 13.5px; color: var(--ink); display: flex; flex-direction: column; gap: 3px;
  }
  .check-text small { color: var(--muted); font-size: 12px; }

  /* File drop */
  .drop {
    border: 1.5px dashed var(--border-strong);
    border-radius: var(--radius-sm);
    padding: 22px 16px;
    text-align: center;
    cursor: pointer;
    color: var(--ink-2);
    transition: all .15s ease;
    background: var(--surface-2);
  }
  .drop:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-tint); }
  .drop .mono { font-size: 11.5px; color: var(--muted); margin-top: 4px; }
  .files { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
  .file-pill {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; padding: 7px 10px 7px 12px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; font-size: 12.5px;
  }
  .file-pill .mono { color: var(--muted); font-size: 11px; }
  .file-pill button {
    appearance: none; border: 0; background: transparent;
    color: var(--muted); cursor: pointer; padding: 4px;
    border-radius: 4px; line-height: 0;
  }
  .file-pill button:hover { background: var(--surface-2); color: var(--ink); }

  /* Buttons */
  .actions {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 28px; padding-top: 22px;
    border-top: 1px solid var(--border);
    gap: 12px;
  }
  .btn {
    appearance: none; border: 0;
    font: inherit; font-size: 14px; font-weight: 500;
    padding: 11px 18px; border-radius: 10px;
    cursor: pointer;
    transition: all .15s ease;
    display: inline-flex; align-items: center; gap: 8px;
    letter-spacing: -.005em;
  }
  .btn-ghost { background: transparent; color: var(--ink-2); }
  .btn-ghost:hover { background: var(--surface-2); color: var(--ink); }
  .btn-primary {
    background: var(--ink); color: var(--bg);
  }
  .btn-primary:hover { background: oklch(0.28 0.012 80); transform: translateY(-1px); box-shadow: var(--shadow-md); }
  .btn-primary:disabled { background: var(--border-strong); color: var(--muted-2); cursor: not-allowed; transform: none; box-shadow: none; }
  .btn-accent {
    background: var(--accent); color: white;
  }
  .btn-accent:hover { filter: brightness(1.07); transform: translateY(-1px); box-shadow: var(--shadow-md); }

  /* Slide transitions */
  .stage { position: relative; }
  .scene {
    animation: sceneIn .35s cubic-bezier(.2,.7,.2,1) both;
  }
  @keyframes sceneIn {
    from { opacity: 0; transform: translateX(14px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  .scene.back {
    animation: sceneInBack .35s cubic-bezier(.2,.7,.2,1) both;
  }
  @keyframes sceneInBack {
    from { opacity: 0; transform: translateX(-14px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  /* Success screen */
  .success-wrap {
    display: flex; flex-direction: column; align-items: center;
    text-align: center; padding: 32px 20px;
    max-width: 560px; margin: 24px auto 0;
  }
  .success-ring {
    width: 72px; height: 72px; border-radius: 50%;
    background: color-mix(in oklab, var(--success) 12%, white);
    border: 1px solid color-mix(in oklab, var(--success) 30%, var(--border));
    display: grid; place-items: center;
    color: var(--success);
    margin-bottom: 22px;
    animation: pop .5s cubic-bezier(.2,1.4,.4,1) both;
  }
  @keyframes pop {
    0% { transform: scale(.6); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  .ticket-id {
    font-family: 'Geist Mono', monospace;
    font-size: 13px; color: var(--ink-2);
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 8px 14px; border-radius: 8px;
    display: inline-flex; align-items: center; gap: 10px;
    margin: 18px 0 6px;
  }
  .ticket-id .copy {
    appearance: none; border: 0; background: transparent;
    color: var(--muted); cursor: pointer; padding: 0;
    display: grid; place-items: center; line-height: 0;
  }
  .ticket-id .copy:hover { color: var(--ink); }
  .summary {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 22px;
    margin: 22px 0 28px;
    text-align: left;
    width: 100%;
  }
  .summary dt {
    font-family: 'Geist Mono', monospace;
    font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em;
    color: var(--muted); margin-bottom: 3px;
  }
  .summary dd { margin: 0 0 12px; font-size: 14px; color: var(--ink); }
  .summary dd:last-child { margin-bottom: 0; }

  /* Inline error */
  .field.has-error .input,
  .field.has-error .textarea { border-color: var(--danger); }
  .err { font-size: 12px; color: var(--danger); }



  /* ----- Type cards (Incidente vs Requisição) ----- */
  .type-card {
    text-align: left;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px 26px 22px;
    cursor: pointer;
    transition: border-color .15s ease, transform .15s ease, box-shadow .2s ease, background .15s ease;
    display: flex; flex-direction: column; gap: 14px;
    min-height: 280px;
    position: relative;
    font-family: inherit;
    color: inherit;
    width: 100%;
    overflow: hidden;
  }
  .type-card::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0;
    width: 3px; background: var(--tone-color, var(--border-strong));
    opacity: 0; transition: opacity .2s ease;
  }
  .type-card.tone-warn { --tone-color: var(--warn); --tone-bg: color-mix(in oklab, var(--warn) 8%, white); }
  .type-card.tone-info { --tone-color: var(--accent); --tone-bg: color-mix(in oklab, var(--accent) 6%, white); }
  .type-card:hover {
    border-color: var(--tone-color);
    box-shadow: var(--shadow-md);
    transform: translateY(-1px);
  }
  .type-card:hover::before { opacity: 1; }
  .type-card:focus-visible { outline: 2px solid var(--tone-color); outline-offset: 2px; }
  .type-card-top {
    display: flex; align-items: center; justify-content: space-between;
  }
  .type-badge {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 12px; font-weight: 500;
    padding: 5px 10px 5px 9px;
    border-radius: 999px;
    background: var(--surface-2);
    color: var(--ink-2);
    border: 1px solid var(--border);
  }
  .type-badge.tone-warn {
    background: color-mix(in oklab, var(--warn) 10%, white);
    color: oklch(0.42 0.12 75);
    border-color: color-mix(in oklab, var(--warn) 25%, var(--border));
  }
  .type-badge.tone-info {
    background: color-mix(in oklab, var(--accent) 8%, white);
    color: color-mix(in oklab, var(--accent) 75%, var(--ink));
    border-color: color-mix(in oklab, var(--accent) 25%, var(--border));
  }
  .type-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--tone-color, var(--muted));
    box-shadow: 0 0 0 3px color-mix(in oklab, var(--tone-color, transparent) 15%, transparent);
  }
  .type-tagline {
    margin: 0;
    font-size: 22px; font-weight: 500; letter-spacing: -.015em;
    line-height: 1.2;
  }
  .type-examples {
    margin-top: 6px; padding-top: 14px;
    border-top: 1px dashed var(--border);
  }
  .type-examples-label {
    font-size: 10px; letter-spacing: .08em;
    color: var(--muted-2); margin-bottom: 6px;
  }
  .type-examples ul {
    list-style: none; padding: 0; margin: 0;
    display: flex; flex-direction: column; gap: 4px;
  }
  .type-examples li {
    font-size: 13.5px; color: var(--ink-2);
    display: flex; align-items: baseline; gap: 8px;
  }
  .type-examples .bullet { color: var(--muted-2); font-weight: 600; }

  /* Crumb with tone (Incidente/Requisição) */
  .crumb-tone-warn .type-dot { background: var(--warn); }
  .crumb-tone-info .type-dot { background: var(--accent); }

  /* ----- Help tooltip ----- */
  .helptip { position: relative; display: inline-flex; }
  .helptip-btn {
    appearance: none; border: 1px solid var(--border);
    background: var(--surface);
    width: 22px; height: 22px;
    border-radius: 50%;
    display: grid; place-items: center;
    color: var(--muted); cursor: help;
    transition: all .15s ease;
  }
  .helptip-btn:hover {
    background: var(--surface-2);
    color: var(--ink);
    border-color: var(--border-strong);
  }
  .helptip-pop {
    position: absolute; top: calc(100% + 8px); left: 50%;
    transform: translateX(-50%);
    background: var(--ink); color: var(--bg);
    font-size: 12.5px; line-height: 1.5;
    padding: 10px 14px;
    border-radius: 8px;
    width: 280px;
    box-shadow: var(--shadow-lg);
    z-index: 20;
    animation: tipIn .15s ease;
  }
  .helptip-pop::before {
    content: ""; position: absolute; top: -4px; left: 50%;
    transform: translateX(-50%) rotate(45deg);
    width: 8px; height: 8px; background: var(--ink);
  }
  .helptip-pop strong { color: var(--bg); font-weight: 600; }
  @keyframes tipIn {
    from { opacity: 0; transform: translateX(-50%) translateY(-4px); }
    to   { opacity: 1; transform: translateX(-50%) translateY(0); }
  }

  /* ----- Modal (confirm dialog) ----- */
  .modal-backdrop {
    position: fixed; inset: 0; z-index: 95;
    background: rgba(10, 9, 7, 0.28);
    backdrop-filter: blur(7px);
    -webkit-backdrop-filter: blur(7px);
    display: grid; place-items: center;
    padding: 24px;
    animation: backIn .15s ease;
  }
  @keyframes backIn { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 24px;
    width: min(420px, 100%);
    box-shadow: var(--shadow-lg);
    animation: modalIn .2s cubic-bezier(.2,1,.4,1);
  }
  @keyframes modalIn {
    from { opacity: 0; transform: scale(.96) translateY(6px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }
  .modal h3 {
    margin: 0 0 6px; font-size: 17px; font-weight: 500; letter-spacing: -.01em;
  }
  .modal p {
    margin: 0 0 18px; font-size: 14px; color: var(--ink-2); line-height: 1.5;
  }
  .modal-actions {
    display: flex; gap: 8px; justify-content: flex-end;
  }
  .btn-danger {
    background: var(--danger); color: white;
  }
  .btn-danger:hover { filter: brightness(1.05); transform: translateY(-1px); box-shadow: var(--shadow-md); }

  /* ===== Atendente — alternador de visão ===== */
  .view-switch {
    display: flex; gap: 2px; padding: 3px;
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 11px;
  }
  .view-tab {
    appearance: none; border: 0; background: transparent;
    font: inherit; font-size: 13px; color: var(--ink-2);
    padding: 7px 14px; border-radius: 8px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 7px;
    transition: all .15s ease;
  }
  .view-tab:hover { color: var(--ink); }
  .view-tab.is-on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); font-weight: 500; }
  .view-tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .view-count {
    font-family: 'Geist Mono', monospace; font-size: 10.5px; font-weight: 500;
    min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
    background: var(--accent); color: white;
    display: inline-grid; place-items: center; line-height: 1;
  }
  @media (max-width: 760px) { .view-tab .lbl { display: none; } }

  /* ===== Barra de busca + filtros ===== */
  .list-toolbar {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 16px; flex-wrap: wrap;
  }
  .search { position: relative; flex: 1; min-width: 220px; }
  .search .search-ico {
    position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
    color: var(--muted-2); pointer-events: none; line-height: 0;
  }
  .search input {
    width: 100%; font-family: inherit; font-size: 14px; color: var(--ink);
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 10px 36px 10px 38px;
    transition: border-color .12s ease, box-shadow .12s ease;
  }
  .search input:hover { border-color: var(--border-strong); }
  .search input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in oklab, var(--accent) 14%, transparent); }
  .search input::placeholder { color: var(--muted-2); }
  .search .clear {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    appearance: none; border: 0; background: transparent; color: var(--muted);
    cursor: pointer; padding: 5px; border-radius: 6px; line-height: 0;
  }
  .search .clear:hover { background: var(--surface-2); color: var(--ink); }

  .status-tabs { display: flex; gap: 4px; flex-wrap: wrap; }
  .status-tab {
    appearance: none; border: 1px solid var(--border); background: var(--surface);
    font: inherit; font-size: 12.5px; color: var(--ink-2);
    padding: 7px 12px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    transition: all .15s ease;
  }
  .status-tab:hover { border-color: var(--border-strong); background: var(--surface-2); }
  .status-tab.is-on { background: var(--ink); color: var(--bg); border-color: var(--ink); opacity: .65; }
  .status-tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .status-tab .st-count { font-family: 'Geist Mono', monospace; font-size: 10.5px; color: var(--muted); }
  .status-tab.is-on .st-count { color: color-mix(in oklab, var(--bg) 65%, var(--ink)); }

  .list-meta { font-size: 13px; color: var(--muted); margin: 0 0 14px; }

  /* ===== Cards de chamado ===== */
  .ticket-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
    gap: var(--gap);
  }
  .ticket-card {
    text-align: left; background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 18px 20px; cursor: pointer; width: 100%;
    font-family: inherit; color: inherit;
    display: flex; flex-direction: column; gap: 12px;
    transition: border-color .15s ease, transform .15s ease, box-shadow .2s ease;
    position: relative;
  }
  .ticket-card:hover { border-color: var(--ink-2); box-shadow: var(--shadow-md); transform: translateY(-1px); }
  .ticket-card:active { transform: translateY(0); }
  .ticket-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .ticket-card.is-active { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in oklab, var(--accent) 16%, transparent); }
  .tc-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .tc-top .tc-time { margin-top: 2px; }
  .tc-time { font-family: 'Geist Mono', monospace; font-size: 11px; color: var(--muted-2); white-space: nowrap; }
  .tc-title {
    font-size: 15.5px; font-weight: 500; letter-spacing: -.01em; margin: 0;
    line-height: 1.35; text-wrap: pretty;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .tc-foot { display: flex; flex-direction: column; gap: 9px; margin-top: auto; }
  .tc-foot-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .tc-assignee {
    display: flex; align-items: center; gap: 6px;
    font-size: 12.5px; color: var(--ink-2);
    padding-top: 10px; border-top: 1px solid var(--border);
  }
  .tc-assignee svg { color: var(--muted-2); flex-shrink: 0; }
  .tc-assignee strong { font-weight: 500; color: var(--ink); }
  .tc-assignee.is-unassigned { color: var(--muted-2); font-style: italic; }
  .tc-req { display: inline-flex; align-items: center; gap: 8px; min-width: 0; }
  .tc-avatar {
    width: 24px; height: 24px; min-width: 24px; border-radius: 50%;
    background: var(--surface-2); border: 1px solid var(--border);
    display: grid; place-items: center; font-size: 10px; font-weight: 500; color: var(--ink-2);
  }
  .tc-avatar.sm { width: 22px; height: 22px; min-width: 22px; font-size: 9.5px; }
  .tc-req-name { font-size: 13px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tc-att {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 12px; color: var(--muted); font-family: 'Geist Mono', monospace;
    background: var(--surface-2); border: 1px solid var(--border);
    padding: 3px 8px; border-radius: 999px; white-space: nowrap;
  }

  /* ===== Fila em lista ===== */
  .ticket-list { display: flex; flex-direction: column; gap: 8px; }
  .ticket-row {
    display: grid; grid-template-columns: minmax(0, 1fr) auto;
    align-items: center; gap: 18px;
    text-align: left; background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 13px 18px; cursor: pointer; width: 100%;
    font-family: inherit; color: inherit;
    transition: border-color .15s ease, box-shadow .2s ease, transform .12s ease;
  }
  .ticket-row:hover { border-color: var(--ink-2); box-shadow: var(--shadow-sm); transform: translateY(-1px); }
  .ticket-row:active { transform: translateY(0); }
  .ticket-row:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .ticket-row.is-active { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in oklab, var(--accent) 16%, transparent); }
  .tr-main { min-width: 0; display: flex; flex-direction: column; gap: 5px; }
  .tr-title {
    font-size: 14.5px; font-weight: 500; letter-spacing: -.01em; margin: 0;
    line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink);
  }
  .tr-sub { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); min-width: 0; }
  .tr-req { color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tr-dot { color: var(--muted-2); }
  .tr-open { font-family: 'Geist Mono', monospace; font-size: 11.5px; color: var(--muted-2); white-space: nowrap; }
  .tr-clip {
    display: inline-flex; align-items: center; gap: 3px;
    font-family: 'Geist Mono', monospace; font-size: 11.5px; color: var(--muted-2); white-space: nowrap;
  }
  .tr-right { display: flex; align-items: center; gap: 14px; justify-content: flex-end; }
  .tr-assignee { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-2); white-space: nowrap; }
  .tr-assignee svg { color: var(--muted-2); flex-shrink: 0; }
  .tr-assignee-name { max-width: 140px; overflow: hidden; text-overflow: ellipsis; }
  .tr-unassigned { font-size: 12px; color: var(--muted-2); white-space: nowrap; font-style: italic; }
  @media (max-width: 720px) {
    .ticket-row { grid-template-columns: 1fr; row-gap: 10px; }
    .tr-right { justify-content: flex-start; flex-wrap: wrap; }
  }

  /* ===== Selos de status ===== */
  .status-badge {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 500; padding: 4px 10px 4px 8px;
    border-radius: 999px; border: 1px solid var(--border);
    background: var(--surface-2); color: var(--ink-2); white-space: nowrap;
  }
  .status-badge .sdot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .status-novo { color: color-mix(in oklab, var(--accent) 62%, var(--ink)); background: color-mix(in oklab, var(--accent) 12%, var(--surface)); border-color: color-mix(in oklab, var(--accent) 28%, var(--border)); }
  .status-andamento { color: color-mix(in oklab, var(--warn) 60%, var(--ink)); background: color-mix(in oklab, var(--warn) 14%, var(--surface)); border-color: color-mix(in oklab, var(--warn) 30%, var(--border)); }
  .status-aguardando { color: var(--muted); background: var(--surface-2); border-color: var(--border-strong); }
  .status-resolvido { color: color-mix(in oklab, var(--success) 60%, var(--ink)); background: color-mix(in oklab, var(--success) 14%, var(--surface)); border-color: color-mix(in oklab, var(--success) 30%, var(--border)); }

  /* ===== Estado vazio ===== */
  .empty-state {
    text-align: center; padding: 56px 20px; color: var(--muted);
    display: flex; flex-direction: column; align-items: center; gap: 6px;
  }
  .empty-icon {
    width: 56px; height: 56px; border-radius: 14px;
    background: var(--surface-2); border: 1px solid var(--border);
    display: grid; place-items: center; color: var(--muted-2); margin-bottom: 8px;
  }
  .empty-title { font-size: 16px; color: var(--ink-2); margin: 0; font-weight: 500; }
  .empty-sub { font-size: 13.5px; margin: 0 0 10px; }

  /* Selo "Meu" — chamado aberto pelo próprio usuário neste protótipo */
  .mine-flag {
    display: inline-flex; align-items: center;
    font-family: 'Geist Mono', monospace; font-size: 9.5px; font-weight: 500;
    letter-spacing: .04em; text-transform: uppercase;
    padding: 1px 6px; border-radius: 999px; margin-right: 6px;
    color: color-mix(in oklab, var(--accent) 78%, var(--ink));
    background: var(--accent-tint);
    border: 1px solid color-mix(in oklab, var(--accent) 26%, var(--border));
  }
  .tr-open + .mine-flag { margin-right: 0; margin-left: 8px; }
  .drawer-foot-status { display: flex; align-items: center; }

  .count-pill {
    font-family: 'Geist Mono', monospace; font-size: 12px;
    background: var(--surface); border: 1px solid var(--border);
    padding: 3px 9px; border-radius: 999px; color: var(--ink-2);
  }

  /* ===== Drawer de preview ===== */
  .drawer-backdrop {
    position: fixed; inset: 0; z-index: 90;
    background: rgba(10, 9, 7, 0.28);
    backdrop-filter: blur(7px);
    -webkit-backdrop-filter: blur(7px);
    display: grid; place-items: center; padding: 24px;
    animation: backIn .2s ease;
  }
  .drawer {
    position: relative; z-index: 91;
    width: min(480px, 100%); max-height: min(86vh, 760px);
    background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow-lg);
    display: flex; flex-direction: column; overflow: hidden;
    animation: modalIn .22s cubic-bezier(.2,1,.4,1);
  }
  .drawer-head { padding: 20px 22px 16px; border-bottom: 1px solid var(--border); }
  .drawer-head-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
  .drawer-close {
    appearance: none; border: 1px solid var(--border); background: var(--surface);
    width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center;
    color: var(--ink-2); cursor: pointer; transition: all .15s ease;
  }
  .drawer-close:hover { background: var(--surface-2); color: var(--ink); border-color: var(--border-strong); }
  .drawer-id { font-family: 'Geist Mono', monospace; font-size: 11.5px; color: var(--muted); }
  .drawer-title { font-size: 20px; font-weight: 500; letter-spacing: -.015em; margin: 8px 0 0; line-height: 1.25; text-wrap: pretty; }
  .drawer-body { flex: 1; min-height: 0; overflow-y: auto; padding: 20px 22px; display: flex; flex-direction: column; gap: 22px; }
  .drawer-meta { display: flex; flex-direction: column; gap: 14px; }
  .dm-item { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .dm-label { font-family: 'Geist Mono', monospace; font-size: 10px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted-2); }
  .dm-val { font-size: 14px; color: var(--ink); display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .dm-dept { color: var(--muted); font-size: 13px; }
  .dm-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .drawer-section { display: flex; flex-direction: column; gap: 10px; }
  .ds-title { font-family: 'Geist Mono', monospace; font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 0; display: flex; align-items: center; gap: 8px; }
  .ds-desc { font-size: 14px; line-height: 1.6; color: var(--ink-2); margin: 0; text-wrap: pretty; }
  .no-att { font-size: 13.5px; color: var(--muted); padding: 14px; border: 1px dashed var(--border-strong); border-radius: var(--radius-sm); text-align: center; background: var(--surface-2); }

  .thumb-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .thumb { margin: 0; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--surface); }
  .thumb-img {
    aspect-ratio: 4 / 3; display: grid; place-items: center;
    background-color: var(--surface-2);
    background-image: repeating-linear-gradient(45deg, color-mix(in oklab, var(--border-strong) 55%, transparent) 0 1px, transparent 1px 9px);
    border-bottom: 1px solid var(--border); color: var(--muted-2);
  }
  .thumb-cap { font-family: 'Geist Mono', monospace; font-size: 11px; color: var(--muted); padding: 7px 9px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ----- SLA (indicador por subcategoria) ----- */
  .sla { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--border); white-space: nowrap; line-height: 1.4; }
  .sla svg { flex-shrink: 0; }
  .sla-alta  { color: color-mix(in oklab, var(--danger) 62%, var(--ink)); background: color-mix(in oklab, var(--danger) 12%, var(--surface)); border-color: color-mix(in oklab, var(--danger) 30%, var(--border)); }
  .sla-media { color: color-mix(in oklab, var(--warn) 58%, var(--ink)); background: color-mix(in oklab, var(--warn) 14%, var(--surface)); border-color: color-mix(in oklab, var(--warn) 32%, var(--border)); }
  .sla-baixa { color: color-mix(in oklab, var(--success) 58%, var(--ink)); background: color-mix(in oklab, var(--success) 12%, var(--surface)); border-color: color-mix(in oklab, var(--success) 30%, var(--border)); }
  [data-theme="dark"] .sla-alta  { color: oklch(0.78 0.14 25); }
  [data-theme="dark"] .sla-media { color: oklch(0.82 0.13 75); }
  [data-theme="dark"] .sla-baixa { color: oklch(0.78 0.13 152); }
  .tc-badges { display: inline-flex; align-items: center; gap: 7px; flex-wrap: wrap; min-width: 0; }
  .tc-num { font-size: 11.5px; font-weight: 500; color: var(--muted); letter-spacing: -.01em; display: block; }
  .sla-result { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 500; white-space: nowrap; }
  .sla-result svg { flex-shrink: 0; }
  .sla-result.ok { color: color-mix(in oklab, var(--success) 62%, var(--ink)); }
  .sla-result.late { color: color-mix(in oklab, var(--danger) 64%, var(--ink)); }
  [data-theme="dark"] .sla-result.ok { color: oklch(0.78 0.13 152); }
  [data-theme="dark"] .sla-result.late { color: oklch(0.78 0.14 25); }

  /* SLA: seletor no modal de subcategoria (gestor) */
  .sla-picker { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .sla-opt { appearance: none; cursor: pointer; text-align: left; display: flex; flex-direction: column; gap: 8px; padding: 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); transition: border-color .15s, background .15s, box-shadow .15s; }
  .sla-opt:hover { border-color: var(--border-strong); }
  .sla-opt-top { display: flex; align-items: center; gap: 8px; }
  .sla-opt-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted-2); flex-shrink: 0; }
  .sla-opt-label { font-size: 14px; font-weight: 500; color: var(--ink); }
  .sla-opt-hours { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); font-family: 'Geist Mono', monospace; }
  .sla-tone-danger .sla-opt-dot { background: var(--danger); }
  .sla-tone-warn .sla-opt-dot { background: var(--warn); }
  .sla-tone-ok .sla-opt-dot { background: var(--success); }
  .sla-opt.is-on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 6%, var(--surface)); box-shadow: 0 0 0 1px var(--accent) inset; }
  .sla-opt.sla-tone-danger.is-on { border-color: var(--danger); box-shadow: 0 0 0 1px var(--danger) inset; background: color-mix(in oklab, var(--danger) 7%, var(--surface)); }
  .sla-opt.sla-tone-warn.is-on { border-color: var(--warn); box-shadow: 0 0 0 1px var(--warn) inset; background: color-mix(in oklab, var(--warn) 9%, var(--surface)); }
  .sla-opt.sla-tone-ok.is-on { border-color: var(--success); box-shadow: 0 0 0 1px var(--success) inset; background: color-mix(in oklab, var(--success) 8%, var(--surface)); }

  /* SLA: selo na lista de subcategorias (gestor) */
  .sla-tag { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 500; padding: 2px 7px; border-radius: 999px; margin-left: 8px; vertical-align: middle; border: 1px solid var(--border); }
  .sla-tag svg { flex-shrink: 0; }
  .sla-tag.sla-tone-danger { color: color-mix(in oklab, var(--danger) 62%, var(--ink)); background: color-mix(in oklab, var(--danger) 10%, var(--surface)); border-color: color-mix(in oklab, var(--danger) 26%, var(--border)); }
  .sla-tag.sla-tone-warn { color: color-mix(in oklab, var(--warn) 55%, var(--ink)); background: color-mix(in oklab, var(--warn) 12%, var(--surface)); border-color: color-mix(in oklab, var(--warn) 28%, var(--border)); }
  .sla-tag.sla-tone-ok { color: color-mix(in oklab, var(--success) 55%, var(--ink)); background: color-mix(in oklab, var(--success) 10%, var(--surface)); border-color: color-mix(in oklab, var(--success) 26%, var(--border)); }
  [data-theme="dark"] .sla-tag.sla-tone-danger { color: oklch(0.78 0.14 25); }
  [data-theme="dark"] .sla-tag.sla-tone-warn { color: oklch(0.82 0.13 75); }
  [data-theme="dark"] .sla-tag.sla-tone-ok { color: oklch(0.78 0.13 152); }
  @media (max-width: 560px) { .sla-picker { grid-template-columns: 1fr; } }

  .drawer-foot {
    padding: 16px 22px; border-top: 1px solid var(--border);
    display: flex; gap: 10px; justify-content: flex-end; background: var(--surface);
  }
  @media (max-width: 680px) { .dm-grid { grid-template-columns: 1fr; } }

  /* ----- Spinner ----- */
  .spinner {
    width: 14px; height: 14px;
    border: 1.8px solid color-mix(in oklab, currentColor 30%, transparent);
    border-top-color: currentColor;
    border-radius: 50%;
    animation: spin .7s linear infinite;
    display: inline-block;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ----- Kbd hint in topbar ----- */
  .kbd-hint {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 12px; color: var(--muted);
  }
  kbd {
    font-family: 'Geist Mono', monospace;
    font-size: 10.5px;
    padding: 2px 6px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 5px;
    box-shadow: 0 1px 0 var(--border);
    color: var(--ink-2);
    min-width: 22px; text-align: center;
  }
  @media (max-width: 680px) { .kbd-hint { display: none; } }

  /* ----- Step label next to dots ----- */
  .step-label {
    font-size: 12px;
    color: var(--muted);
    margin-left: 6px;
    font-variant-numeric: tabular-nums;
  }
  .step-label strong { color: var(--ink-2); font-weight: 500; }

  /* ----- Char meter ----- */
  .char-meter {
    font-variant-numeric: tabular-nums;
    color: var(--muted-2);
    transition: color .15s ease;
  }
  .char-meter.ok { color: var(--success); }

  /* ----- Form section divider ----- */
  .form-section {
    display: flex; align-items: baseline; justify-content: space-between;
    font-family: 'Geist Mono', monospace;
    font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--muted); padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 6px;
  }
  .form-section-hint { text-transform: none; letter-spacing: 0; color: var(--muted-2); font-size: 11px; }

  /* ----- Error state ----- */
  .input.has-error-input, .textarea.has-error-input {
    border-color: var(--danger);
    background: color-mix(in oklab, var(--danger) 3%, white);
  }
  .input.has-error-input:focus, .textarea.has-error-input:focus {
    box-shadow: 0 0 0 3px color-mix(in oklab, var(--danger) 15%, transparent);
  }
  .select.has-error-input { border-color: var(--danger); }
  .qf-hint { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .qf-desc { line-height: 1.45; }

  /* Nota de ajuda (recognition > recall) */
  .qf-note {
    display: flex; align-items: flex-start; gap: 9px;
    font-size: 12.5px; line-height: 1.5; color: var(--ink-2);
    background: var(--accent-tint);
    border: 1px solid color-mix(in oklab, var(--accent) 18%, var(--border));
    border-radius: var(--radius-sm);
    padding: 11px 13px;
  }
  .qf-note svg { flex-shrink: 0; margin-top: 1px; color: var(--accent); }
  .qf-note strong { color: var(--ink); font-weight: 600; }
  .qf-note span { flex: 1; }
  .qf-note-close {
    appearance: none; border: 0; background: transparent;
    color: var(--muted); cursor: pointer; padding: 3px; border-radius: 6px;
    line-height: 0; flex-shrink: 0; margin: -2px -3px 0 0;
    transition: background .15s ease, color .15s ease;
  }
  .qf-note-close svg { color: currentColor; margin-top: 0; }
  .qf-note-close:hover { background: color-mix(in oklab, var(--accent) 14%, transparent); color: var(--ink); }
  .qf-note-close:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Cartões de tipo (Incidente vs Requisição) no formulário único */
  .qf-typecards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 560px) { .qf-typecards { grid-template-columns: 1fr; } }
  .qf-type {
    text-align: left; background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 14px 16px; cursor: pointer;
    display: flex; flex-direction: column; gap: 8px;
    font-family: inherit; color: inherit;
    transition: border-color .15s ease, box-shadow .2s ease, background .15s ease;
  }
  .qf-type.tone-warn { --tone-color: var(--warn); }
  .qf-type.tone-info { --tone-color: var(--accent); }
  .qf-type:hover { border-color: var(--border-strong); background: var(--surface-2); }
  .qf-type.is-on { border-color: var(--tone-color); box-shadow: 0 0 0 3px color-mix(in oklab, var(--tone-color) 15%, transparent); background: var(--surface); }
  .qf-type:focus-visible { outline: 2px solid var(--tone-color); outline-offset: 2px; }
  .qf-type-head { display: flex; align-items: center; justify-content: space-between; }
  .qf-type-radio {
    width: 18px; height: 18px; border-radius: 50%;
    border: 1.5px solid var(--border-strong);
    display: grid; place-items: center; transition: border-color .15s ease;
  }
  .qf-type.is-on .qf-type-radio { border-color: var(--tone-color); }
  .qf-type.is-on .qf-type-radio::after { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--tone-color); }
  .qf-type-tag { font-size: 15px; font-weight: 500; letter-spacing: -.01em; }
  .qf-type-desc { font-size: 12.5px; color: var(--muted); line-height: 1.45; }
  .qf-type-ex { font-size: 11.5px; color: var(--muted-2); font-family: 'Geist Mono', monospace; margin-top: auto; }
  .err {
    font-size: 12.5px; color: var(--danger);
    display: flex; align-items: center; gap: 6px;
    margin-top: 2px;
  }
  .err svg { flex-shrink: 0; }

  @media (max-width: 680px) {
    .form-grid { grid-template-columns: 1fr; }
    h1 { font-size: 26px; }
    .form-card { padding: 22px; }
    .type-card { min-height: 240px; padding: 20px; }
    .type-tagline { font-size: 19px; }
  }

  /* ===== Detalhe / atendimento do chamado ===== */
  .td-wrap { max-width: 720px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; gap: 14px; }
  .td-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 24px 26px; box-shadow: var(--shadow-sm);
  }
  .td-head-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
  .td-title { font-size: 24px; font-weight: 500; letter-spacing: -.02em; margin: 0; line-height: 1.2; text-wrap: pretty; }
  .td-id { font-family: 'Geist Mono', monospace; font-size: 15px; color: var(--muted-2); white-space: nowrap; margin-top: 4px; }
  .td-badges { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .td-path { font-size: 14px; color: var(--ink-2); margin-top: 16px; display: flex; align-items: center; gap: 6px; }
  .td-path .sep { color: var(--muted-2); }
  .td-meta { margin-top: 12px; display: flex; flex-direction: column; gap: 4px; font-size: 14px; color: var(--muted); }
  .td-meta strong { color: var(--ink-2); font-weight: 500; }
  .td-meta .mdot { color: var(--muted-2); margin: 0 2px; }

  .td-section-label {
    font-family: 'Geist Mono', monospace; font-size: 11.5px; text-transform: uppercase;
    letter-spacing: .08em; color: var(--muted); margin: 0 0 12px;
    display: flex; align-items: center; gap: 8px;
  }
  .td-section-label .n { color: var(--muted-2); font-weight: 500; }
  .td-desc { font-size: 14.5px; line-height: 1.6; color: var(--ink-2); margin: 0; text-wrap: pretty; }
  .td-empty { font-size: 14px; color: var(--muted-2); margin: 0; }

  /* Timeline de trâmites */
  .td-tram-list { display: flex; flex-direction: column; gap: 12px; }
  .td-tram {
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 14px 16px;
    animation: sceneIn .3s cubic-bezier(.2,.7,.2,1) both;
  }
  .td-tram-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
  .td-tram-who { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .td-tram-avatar {
    width: 24px; height: 24px; min-width: 24px; border-radius: 50%;
    background: var(--surface); border: 1px solid var(--border);
    display: grid; place-items: center; font-size: 9.5px; font-weight: 500; color: var(--ink-2);
  }
  .td-tram-author { font-size: 13px; font-weight: 500; color: var(--ink-2); }
  .td-tram-tag {
    font-family: 'Geist Mono', monospace; font-size: 9.5px; text-transform: uppercase; letter-spacing: .05em;
    color: color-mix(in oklab, var(--accent) 62%, var(--ink));
    background: color-mix(in oklab, var(--accent) 12%, var(--surface));
    border: 1px solid color-mix(in oklab, var(--accent) 24%, var(--border));
    padding: 1px 6px; border-radius: 5px;
  }
  .td-tram-time { font-family: 'Geist Mono', monospace; font-size: 11.5px; color: var(--muted-2); white-space: nowrap; }
  .td-tram-body { font-size: 14px; line-height: 1.55; color: var(--ink); margin: 0; text-wrap: pretty; }
  .td-tram-status {
    font-size: 12.5px; color: var(--muted); margin-top: 10px;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .td-tram-status .arrow { color: var(--muted-2); }
  .td-tram-status .to { color: var(--ink-2); font-weight: 500; }
  .td-tram-file { display: inline-flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 13px; }
  .td-tram-file a { color: color-mix(in oklab, var(--accent) 70%, var(--ink)); text-decoration: none; font-weight: 500; }
  .td-tram-file a:hover { text-decoration: underline; }
  .td-tram-file .fsize { font-family: 'Geist Mono', monospace; color: var(--muted-2); font-size: 11px; }
  .td-tram-file svg { color: var(--success); flex-shrink: 0; }

  /* Compositor de resposta */
  .td-compose { margin-top: 16px; border-top: 1px solid var(--border); padding-top: 18px; }
  .td-compose textarea {
    width: 100%; font-family: inherit; font-size: 14px; color: var(--ink);
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 11px 13px; min-height: 88px; resize: vertical; line-height: 1.55;
    transition: border-color .12s ease, box-shadow .12s ease;
  }
  .td-compose textarea:hover { border-color: var(--border-strong); }

<style>

  /* Gráfico de linhas */
  .line-legend { display: flex; align-items: center; gap: 20px; }

  .line-legend-swatch { width: 18px; height: 3px; border-radius: 2px; display: inline-block; }
  .line-svg { width: 100%; height: auto; display: block; overflow: visible; }
  .line-grid { stroke: var(--border); stroke-width: 1; }
  .line-axis-label { fill: var(--muted-2); font-size: 11px; font-family: 'Geist Mono', monospace; }

  /* Tabela alternativa dos gráficos */
  .chart-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }

  .chart-table td { color: var(--ink-2); }
  .chart-table .num { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink); font-weight: 500; }
  .chart-table .swatch-cell { display: inline-flex; align-items: center; gap: 8px; }

  /* Skeleton de carregamento */
  .skel {
    border-radius: 8px;
    background: linear-gradient(90deg,
